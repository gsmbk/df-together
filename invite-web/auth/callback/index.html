<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#032d60" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Finish signing in — DF Together</title>
  </head>
  <body>
    <header class="site-header compact-header">
      <a class="brand" href="/" aria-label="DF Together home">
        <span class="brand-mark" aria-hidden="true">DF</span>
        <span>DF Together</span>
      </a>
    </header>
    <main class="handoff-shell">
      <section class="handoff-card" aria-live="polite">
        <div class="handoff-mark success-mark" aria-hidden="true">✓</div>
        <p class="eyebrow">SECURE SIGN-IN</p>
        <h1 id="callback-title">Finish in DF Together.</h1>
        <p id="callback-message">Your email was verified. Open the app to finish signing in.</p>
        <a class="button button-primary" id="finish-sign-in" href="dftogether://auth/callback">Open DF Together</a>
        <a class="button button-secondary is-disabled" data-testflight-link href="#">iPhone beta coming soon</a>
        <p class="security-note">This page does not store your sign-in details.</p>
      </section>
    </main>
    <script src="/config.js"></script>
    <script src="/site.js"></script>
    <script src="/auth-callback.js"></script>
  </body>
</html>
